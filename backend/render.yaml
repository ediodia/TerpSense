services:
  - type: web
    name: terpsense-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_MOCK_DATA
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: AZURE_OPENAI_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_DEPLOYMENT
        value: gpt-5.4-mini
      - key: AZURE_OPENAI_API_VERSION
        value: "2024-12-01-preview"
      - key: NESSIE_API_KEY
        sync: false
